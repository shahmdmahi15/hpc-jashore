# HPC Jashore — hpc.toufiquzzaman.com
# Nginx reverse proxy on Lightsail. Web (Next.js :3000) + API (NestJS :4000, PM2).
# Realtime-safe: SSE + Socket.IO locations disable buffering and hold connections open.

upstream hpc_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream hpc_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

# Auth brute-force protection (PIN endpoint is stricter — see nested location).
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=pin:10m rate=2r/s;

server {
  listen 80;
  listen [::]:80;
  server_name hpc.toufiquzzaman.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name hpc.toufiquzzaman.com;

  ssl_certificate     /etc/letsencrypt/live/hpc.toufiquzzaman.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hpc.toufiquzzaman.com/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # --- API (REST) ---
  location /api/ {
    proxy_pass http://hpc_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Login / refresh / sessions: 5 req/s.
    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://hpc_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Desk PIN verify: 2 req/s — brute-force target, keep tight.
    location = /api/auth/pin-verify {
      limit_req zone=pin burst=5 nodelay;
      proxy_pass http://hpc_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # --- Socket.IO (bidirectional rooms) ---
  location /socket.io/ {
    proxy_pass http://hpc_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # --- SSE (TV + dashboards, one-way feeds) ---
  location /sse/ {
    proxy_pass http://hpc_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Accel-Buffering no;
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 86400s;
  }

  # --- Web PWA ---
  location / {
    proxy_pass http://hpc_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Long-cache immutable Next.js assets.
  location /_next/static/ {
    proxy_pass http://hpc_web;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
