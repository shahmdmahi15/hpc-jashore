# HPC Jashore — hpc.toufiquzzaman.com
# Nginx reverse proxy on Lightsail. Web (Next.js :3000) + API (NestJS :4000, PM2).
# Realtime-safe: SSE + Socket.IO locations disable buffering and hold connections open.

upstream hpc_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream hpc_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

# Auth brute-force protection (PIN endpoint is stricter — see nested location).
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=pin:10m rate=2r/s;

server {
  listen 80;
  listen [::]:80;
  server_name hpc.toufiquzzaman.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name hpc.toufiquzzaman.com;

  # Cloudflare Origin CA Certificate (up to 15-year validity)
  ssl_certificate     /etc/ssl/certs/hpc.toufiquzzaman.com.crt;
  ssl_certificate_key /etc/ssl/private/hpc.toufiquzzaman.com.key;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Cloudflare Real-IP Restoration
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # --- API (REST) ---
  location /api/ {
    proxy_pass http://hpc_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Login / refresh / sessions: 5 req/s.
    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://hpc_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Desk PIN verify: 2 req/s — brute-force target, keep tight.
    location = /api/auth/pin-verify {
      limit_req zone=pin burst=5 nodelay;
      proxy_pass http://hpc_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # --- Socket.IO (bidirectional rooms) ---
  location /socket.io/ {
    proxy_pass http://hpc_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # --- SSE (TV + dashboards, one-way feeds) ---
  location /sse/ {
    proxy_pass http://hpc_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Accel-Buffering no;
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 86400s;
  }

  # --- Web PWA ---
  location / {
    proxy_pass http://hpc_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Long-cache immutable Next.js assets.
  location /_next/static/ {
    proxy_pass http://hpc_web;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
