[package]
name = "hpc-tauri"
version = "0.1.1"
description = "HPC Jashore Desktop & Mobile Native Client"
authors = ["Dr. Md. Toufiq Uz Zaman", "Antigravity"]
edition = "2021"

[lib]
name = "hpc_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
