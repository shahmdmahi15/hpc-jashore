<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HPC Health & Pain Care Center — Jashore</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #04120d;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      text-align: center;
      padding: 32px;
      max-width: 440px;
      width: 90%;
    }
    .logo-container {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 12px 30px -6px rgba(16, 185, 129, 0.35);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(16, 185, 129, 0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .doctor {
      font-size: 13px;
      color: #10b981;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .status-text {
      font-size: 12px;
      color: #64748b;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .error-card {
      display: none;
      background: rgba(153, 27, 27, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 16px;
      padding: 20px;
      margin-top: 16px;
    }
    .error-card p {
      color: #fca5a5;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .retry-btn {
      background: #059669;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
      transition: background 0.2s, transform 0.1s;
    }
    .retry-btn:hover { background: #10b981; }
    .retry-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
        <path d="M12 5 9.04 9H6.38"/>
        <path d="M17.62 9h-2.66L12 5"/>
        <path d="m8.5 13 2.5 3 4.5-5"/>
      </svg>
    </div>

    <div class="spinner" id="spinner"></div>

    <h1>Health & Pain Care Center</h1>
    <div class="subtitle">Clinical Workstation — Jashore</div>
    <div class="doctor">ডাঃ মোঃ তৌফিক উজ জামান</div>

    <div class="status-text" id="status">Connecting to secure clinical cloud...</div>

    <div class="error-card" id="errorCard">
      <p id="errorMsg">Could not reach the clinical cloud server. Please verify your internet connection.</p>
      <button class="retry-btn" onclick="navigateToWorkstation()">Retry Connection</button>
    </div>
  </div>

  <script>
    const WORKSTATION_URL = "https://hpc.toufiquzzaman.com/admin";
    let redirectTimeout;

    function navigateToWorkstation() {
      const errorCard = document.getElementById('errorCard');
      const spinner = document.getElementById('spinner');
      const status = document.getElementById('status');

      if (errorCard) errorCard.style.display = 'none';
      if (spinner) spinner.style.display = 'block';
      if (status) status.innerText = 'Establishing secure session...';

      // Perform direct navigation
      window.location.replace(WORKSTATION_URL);

      // Timeout fallback if navigation hangs or fails to reach network
      clearTimeout(redirectTimeout);
      redirectTimeout = setTimeout(() => {
        if (spinner) spinner.style.display = 'none';
        if (status) status.innerText = '';
        if (errorCard) errorCard.style.display = 'block';
      }, 7000);
    }

    // Auto-launch on window readiness
    window.addEventListener('DOMContentLoaded', () => {
      navigateToWorkstation();
    });
  </script>
</body>
</html>
