name: Deploy to AWS Lightsail

on:
  push:
    branches: [main, develop, master]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Verification
        run: pnpm -r lint

      - name: Unit Tests
        run: pnpm --filter @hpc/api test:mrn

      - name: Deploy, Build & Reload on Lightsail
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USERNAME }}
          key: ${{ secrets.HOST_KEY }}
          port: 22
          timeout: 10m
          script_stop: true
          script: |
            set -e
            echo "🚀 [Lightsail] Starting automated pull, install and Turbopack build via GitHub Action..."
            cd /var/www/hpc-jashore

            # Export system paths for non-interactive shell
            export PATH=$HOME/.local/share/pnpm:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/usr/local/bin:/usr/bin:/bin:$PATH
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"
            [ -s "$HOME/.bashrc" ] && . "$HOME/.bashrc"

            echo "📍 Node version: $(node -v)"
            echo "📍 pnpm version: $(pnpm -v)"

            echo "📥 Fetching and pulling latest code..."
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # Ensure deprecated middleware is not present
            rm -f apps/web/middleware.ts

            echo "📦 Installing all dependencies on Lightsail..."
            pnpm install
            pnpm rebuild better-sqlite3

            echo "🔨 Building API on Lightsail..."
            pnpm --filter @hpc/api build

            echo "⚡ Building Web with Next.js Turbopack on Lightsail..."
            pnpm --filter @hpc/web build

            echo "🔄 Reloading PM2 processes..."
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save

            echo "🌐 Reloading Nginx..."
            sudo systemctl reload nginx

            echo "🔍 Verifying live server health..."
            sleep 2
            curl -I -s http://127.0.0.1:3000/ | head -n 5

            echo "✅ Lightsail Turbopack Deployment Successfully Finished!"
