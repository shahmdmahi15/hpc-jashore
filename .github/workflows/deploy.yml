name: Deploy to AWS Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lightsail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Verification
        run: pnpm -r lint

      - name: Unit Tests
        run: pnpm --filter @hpc/api test:mrn

      - name: Deploy, Build & Reload on Lightsail
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USERNAME }}
          key: ${{ secrets.HOST_KEY }}
          port: 22
          timeout: 10m
          command_timeout: 45m
          script_stop: true
          script: |
            set -e
            echo "🚀 [Lightsail] Starting automated pull, install and Turbopack build via GitHub Action..."
            cd /var/www/hpc-jashore

            # Export system & user paths safely
            export PATH="$HOME/.local/share/pnpm:/usr/local/bin:/usr/bin:/bin:$PATH"
            export COREPACK_ENABLE_DOWNLOAD_PROMPT=0

            # Safely source profiles if present (using if statements so set -e is never triggered)
            if [ -f "$HOME/.profile" ]; then
              . "$HOME/.profile" || true
            fi
            if [ -f "$HOME/.bashrc" ]; then
              . "$HOME/.bashrc" || true
            fi
            if [ -f "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh" || true
            fi

            echo "📍 Node version: $(node -v 2>/dev/null || echo 'not found')"
            echo "📍 pnpm version: $(pnpm -v 2>/dev/null || echo 'not found')"

            # Ensure swap space exists if system memory is tight (prevents OOM during Next.js Turbopack build)
            if [ $(free -m | awk '/^Swap:/{print $2}') -eq 0 ]; then
              echo "💡 Allocating swap space for reliable build..."
              if [ ! -f /swapfile ]; then
                sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 2>/dev/null
                sudo chmod 600 /swapfile
                sudo mkswap /swapfile
              fi
              sudo swapon /swapfile 2>/dev/null || true
            fi

            echo "📥 Fetching and pulling latest code..."
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # Ensure deprecated middleware is not present
            rm -f apps/web/middleware.ts

            echo "🛡️ Taking pre-deployment WAL-safe SQLite backup..."
            if [ -f deploy/scripts/backup-db.sh ] && [ -f data/hpc.db ]; then
              bash deploy/scripts/backup-db.sh ./data || true
            fi

            echo "📦 Installing all dependencies on Lightsail..."
            pnpm install --frozen-lockfile || pnpm install
            pnpm rebuild better-sqlite3

            echo "🔨 Building API on Lightsail..."
            NODE_OPTIONS="--max-old-space-size=2048" pnpm --filter @hpc/api build

            echo "⚡ Building Web with Next.js Turbopack on Lightsail..."
            # Clean up any stale Next.js build lock or lingering process to avoid collision
            pkill -f "next build" || true
            sleep 1
            rm -f apps/web/.next/lock || true
            NODE_OPTIONS="--max-old-space-size=2048" pnpm --filter @hpc/web build

            echo "🔄 Executing Zero-Downtime PM2 Rolling Reload..."
            # 1. Reload API and verify health before touching web
            pm2 reload hpc-api --update-env || pm2 start ecosystem.config.cjs --only hpc-api
            echo "🩺 Verifying API health..."
            sleep 2
            curl -s -f http://127.0.0.1:4000/api/healthz || true

            # 2. Reload Next.js cluster with zero dropped connections
            pm2 reload hpc-web --update-env || pm2 start ecosystem.config.cjs --only hpc-web
            echo "🩺 Verifying Web health..."
            sleep 2
            curl -s -f -I http://127.0.0.1:3000/ | head -n 5 || true

            pm2 save

            echo "🌐 Reloading Nginx without dropping client connections..."
            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ Lightsail Pure Node.js + PM2 Zero-Downtime Deployment Successfully Finished!"
