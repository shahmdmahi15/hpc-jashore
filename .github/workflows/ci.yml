name: ci

on:
  push:
    branches: [main, develop, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck / Lint
        run: pnpm -r lint

      - name: Unit Tests
        run: pnpm --filter @hpc/api test:mrn

      - name: Build API
        run: pnpm --filter @hpc/api build

      - name: Build Web
        run: pnpm --filter @hpc/web build
