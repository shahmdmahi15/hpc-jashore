name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck / Lint
        run: pnpm -r lint

      - name: Unit Tests
        run: pnpm --filter @hpc/api test:mrn

      - name: Build API
        run: pnpm --filter @hpc/api build

      - name: Build Web
        run: pnpm --filter @hpc/web build
