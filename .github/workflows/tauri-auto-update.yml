name: Tauri Windows & Android Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/tauri/**'
      - 'apps/web/**'
      - 'apps/android/**'
      - 'packages/**'
      - '.github/workflows/tauri-auto-update.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (e.g. 0.1.0; leave blank to infer from git tag or package.json)'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Custom release notes (Markdown supported; leave blank for automatic commit summary)'
        required: false
        default: ''
        type: string
      build_android:
        description: 'Build Android / Android TV APK release alongside Windows'
        required: false
        default: true
        type: boolean
      draft:
        description: 'Create as a draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. WINDOWS RELEASE JOB (build-windows)
  # Compiles, cryptographically signs, releases, and publishes Windows Tauri v2
  # =========================================================================
  build-windows:
    name: Build & Release Windows (Tauri v2)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Package Management & Runtime Setup (reads packageManager from package.json)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Rust Toolchain (MSVC) & Target Caching
      - name: Setup Rust MSVC Toolchain (stable-x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies & Target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/tauri -> target

      # Monorepo Dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build Web Application
      - name: Build Web Application
        run: pnpm --filter @hpc/web build

      # Version Resolution & Metadata Preparation
      - name: Resolve Release Version & Metadata
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          set -euo pipefail

          # 1. Determine SemVer Version & Tag
          if [ -n "${INPUT_VERSION:-}" ]; then
            CLEAN_VERSION="${INPUT_VERSION#v}"
            TAG_NAME="v${CLEAN_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            CLEAN_VERSION="${RAW_TAG#v}"
            TAG_NAME="${RAW_TAG}"
          else
            PKG_VERSION=$(jq -r '.version // empty' apps/tauri/package.json 2>/dev/null || true)
            if [ -z "${PKG_VERSION}" ]; then
              PKG_VERSION=$(jq -r '.version // empty' package.json 2>/dev/null || echo "0.1.0")
            fi
            CLEAN_VERSION="${PKG_VERSION}"
            TAG_NAME="v${CLEAN_VERSION}"
          fi

          # 2. Determine Release Notes
          if [ -n "${INPUT_NOTES:-}" ]; then
            RELEASE_NOTES="${INPUT_NOTES}"
          else
            COMMIT_SUBJECT=$(git log -1 --pretty=format:"%s")
            SHORT_SHA=$(git rev-parse --short HEAD)
            RELEASE_NOTES="HPC Jashore v${CLEAN_VERSION} (${SHORT_SHA})&#10;&#10;${COMMIT_SUBJECT}"
          fi

          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "${RELEASE_NOTES}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "Target Release Version: ${CLEAN_VERSION}"
          echo "Target Release Tag:     ${TAG_NAME}"

      # Compile & Cryptographically Sign Tauri Windows App
      - name: Build Tauri Windows App
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @hpc/tauri tauri build

      # Collect Artifacts (.exe, .msi, .nsis.zip, .sig) & Parse Signature
      - name: Collect Build Artifacts & Signature
        id: artifacts
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p staging/windows

          SEARCH_PATHS=(
            "apps/tauri/target/release/bundle"
            "apps/tauri/target/x86_64-pc-windows-msvc/release/bundle"
            "target/release/bundle"
          )

          for DIR in "${SEARCH_PATHS[@]}"; do
            if [ -d "$DIR" ]; then
              echo "Scanning $DIR for bundles..."
              find "$DIR" -type f \( \
                -name "*.exe" -o \
                -name "*.msi" -o \
                -name "*.nsis.zip" -o \
                -name "*.zip" -o \
                -name "*.sig" \
              \) -exec cp -v {} staging/windows/ \; 2>/dev/null || true
            fi
          done

          echo "Staged Windows artifacts:"
          ls -la staging/windows/

          # Tauri v2 NSIS auto-updater expects the .nsis.zip archive
          UPDATER_ASSET=$(find staging/windows -type f -name "*nsis.zip" | head -n 1 || true)
          if [ -z "$UPDATER_ASSET" ]; then
            UPDATER_ASSET=$(find staging/windows -type f -name "*.zip" | head -n 1 || true)
          fi
          if [ -z "$UPDATER_ASSET" ]; then
            UPDATER_ASSET=$(find staging/windows -type f -name "*.exe" | head -n 1 || true)
          fi

          if [ -z "$UPDATER_ASSET" ]; then
            echo "::error::No installer or updater binary found in staging/windows!"
            exit 1
          fi

          UPDATER_FILENAME=$(basename "$UPDATER_ASSET")
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/${UPDATER_FILENAME}"

          # Extract cryptographic Minisign signature (.sig file content)
          SIG_FILE="${UPDATER_ASSET}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            SIG_FILE=$(find staging/windows -type f -name "*.sig" | head -n 1 || true)
          fi

          SIGNATURE=""
          if [ -n "$SIG_FILE" ] && [ -f "$SIG_FILE" ]; then
            SIGNATURE=$(tr -d '\r\n' < "$SIG_FILE")
            echo "Extracted signature from $(basename "$SIG_FILE") (${#SIGNATURE} chars)"
          else
            echo "::warning::No .sig file found. Verify TAURI_SIGNING_PRIVATE_KEY secret configuration."
          fi

          echo "download_url=${DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"
          echo "signature=${SIGNATURE}" >> "$GITHUB_OUTPUT"
          echo "updater_filename=${UPDATER_FILENAME}" >> "$GITHUB_OUTPUT"

      # Create or Update GitHub Release with Assets
      - name: Create or Update GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: HPC Jashore v${{ steps.meta.outputs.version }}
          body: ${{ steps.meta.outputs.release_notes }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: staging/windows/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Notify HPC Update Server via Signed Webhook
      - name: Publish Update Metadata to Update Server
        env:
          UPDATE_SECRET: ${{ secrets.UPDATE_WEBHOOK_SECRET }}
          PLATFORM: 'windows-x86_64'
          VERSION: ${{ steps.meta.outputs.version }}
          SIGNATURE: ${{ steps.artifacts.outputs.signature }}
          DOWNLOAD_URL: ${{ steps.artifacts.outputs.download_url }}
          NOTES: ${{ steps.meta.outputs.release_notes }}
        run: |
          set -euo pipefail

          if [ -z "${UPDATE_SECRET:-}" ]; then
            echo "::warning::UPDATE_WEBHOOK_SECRET is not configured in repository secrets. Skipping webhook publication."
            exit 0
          fi

          jq -n \
            --arg platform "$PLATFORM" \
            --arg version "$VERSION" \
            --arg signature "$SIGNATURE" \
            --arg downloadUrl "$DOWNLOAD_URL" \
            --arg notes "$NOTES" \
            '{
              platform: $platform,
              version: $version,
              signature: $signature,
              url: $downloadUrl,
              downloadUrl: $downloadUrl,
              notes: $notes
            }' > update-payload.json

          echo "Prepared JSON payload (safe inspection):"
          jq '{platform, version, downloadUrl, signature_length: (.signature | length)}' update-payload.json

          echo "Posting release metadata to https://hpc.toufiquzzaman.com/api/updates/publish..."
          HTTP_RESPONSE=$(curl -sS -w "\n%{http_code}" \
            --retry 3 \
            --retry-delay 5 \
            -X POST "https://hpc.toufiquzzaman.com/api/updates/publish" \
            -H "Content-Type: application/json" \
            -H "X-UPDATE-SECRET: ${UPDATE_SECRET}" \
            -d @update-payload.json)

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)

          echo "Server Response (HTTP ${HTTP_STATUS}):"
          echo "${HTTP_BODY}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "::error::Update server rejected publish request with HTTP ${HTTP_STATUS}"
            exit 1
          fi

          echo "Successfully published update metadata for v${VERSION} (${PLATFORM})!"

  # =========================================================================
  # 2. ANDROID TV RELEASE JOB (build-android-tv)
  # Compiles universal APK, uploads to GitHub Releases, and registers update
  # =========================================================================
  build-android-tv:
    name: Build & Release Android TV (Universal APK)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_android != false }}
    timeout-minutes: 60
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "PATH=${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}" >> "$GITHUB_ENV"

          echo "Configuring local.properties for Gradle..."
          echo "sdk.dir=${ANDROID_HOME}" > apps/android/TV/local.properties

          if [ -d "${ANDROID_HOME}/cmdline-tools/latest/bin" ]; then
            SDK_MGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDK_MGR="sdkmanager"
          else
            SDK_MGR=""
          fi

          if [ -n "$SDK_MGR" ]; then
            echo "Using sdkmanager at $SDK_MGR"
            yes | "$SDK_MGR" --licenses || true
            yes | "$SDK_MGR" --install "build-tools;35.0.0" "platforms;android-35" || true
          fi

      - name: Resolve Release Version
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            CLEAN_VERSION="${INPUT_VERSION#v}"
            TAG_NAME="v${CLEAN_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            CLEAN_VERSION="${RAW_TAG#v}"
            TAG_NAME="${RAW_TAG}"
          else
            PKG_VERSION=$(jq -r '.version // empty' apps/tauri/package.json 2>/dev/null || echo "0.1.1")
            CLEAN_VERSION="${PKG_VERSION}"
            TAG_NAME="v${CLEAN_VERSION}"
          fi
          VERSION_CODE=$(grep -E 'versionCode\s*=\s*[0-9]+' apps/android/TV/app/build.gradle.kts | head -n1 | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/' || echo "5")
          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${CLEAN_VERSION} (versionCode: ${VERSION_CODE}, Tag: ${TAG_NAME})"

      - name: Compile Universal Android TV Release APK
        working-directory: apps/android/TV
        run: |
          chmod +x gradlew
          # Clean any stale build caches
          ./gradlew clean --no-daemon
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage Android TV APK
        id: stage_android
        run: |
          set -euo pipefail
          mkdir -p staging/android
          VERSION="${{ steps.meta.outputs.version }}"

          APK_SRC="apps/android/TV/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Searching for generated release APKs..."
            APK_SRC=$(find apps/android/TV/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "::error::Release APK not found in apps/android/TV/app/build/outputs/apk/release"
            find apps/android/TV -name "*.apk" || true
            exit 1
          fi

          echo "Found release APK: $APK_SRC"
          cp -v "$APK_SRC" "staging/android/hpc-jashore-tv.apk"
          cp -v "$APK_SRC" "staging/android/HPC-Jashore-TV-v${VERSION}.apk"

          ls -lh staging/android/

      - name: Upload Android TV Release APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          files: staging/android/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Android TV Release to Server Updater API
        env:
          UPDATE_SECRET: ${{ secrets.UPDATE_WEBHOOK_SECRET }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          set -euo pipefail

          if [ -z "${UPDATE_SECRET:-}" ]; then
            echo "Notice: UPDATE_WEBHOOK_SECRET is not configured; skipping in-app updater registry publish."
            exit 0
          fi

          DOWNLOAD_URL="https://github.com/shahmdmahi15/hpc-jashore/releases/download/${TAG_NAME}/hpc-jashore-tv.apk"
          UPDATE_SERVER="https://hpc.toufiquzzaman.com/api/updates/publish"
          PLATFORM="android-tv"

          cat <<EOF > update-tv-payload.json
          {
            "platform": "${PLATFORM}",
            "version": "${VERSION}",
            "downloadUrl": "${DOWNLOAD_URL}",
            "versionCode": ${{ steps.meta.outputs.version_code }},
            "signature": "",
            "notes": "HPC Jashore Android TV Universal Release v${VERSION}"
          }
          EOF

          echo "Prepared Android TV update payload:"
          cat update-tv-payload.json

          echo "Publishing Android TV release metadata to ${UPDATE_SERVER}..."
          HTTP_RESPONSE=$(curl -sS -w "\n%{http_code}" \
            --retry 3 \
            --retry-delay 5 \
            -X POST "${UPDATE_SERVER}" \
            -H "Content-Type: application/json" \
            -H "X-UPDATE-SECRET: ${UPDATE_SECRET}" \
            -d @update-tv-payload.json || true)

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)

          echo "Server Response (HTTP ${HTTP_STATUS}):"
          echo "${HTTP_BODY}"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "::warning::Update server returned HTTP ${HTTP_STATUS} (registry might require re-sync)"
          else
            echo "Successfully published Android TV update metadata for v${VERSION} (${PLATFORM})!"
          fi
